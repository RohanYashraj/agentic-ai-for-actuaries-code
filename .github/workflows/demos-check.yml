name: demos-check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Fails if any chapter script can no longer be transformed into its
      # browser demo (e.g. a new decorator shape) or a config/data file
      # referenced by scripts/demos.config.json is missing.
      - run: python3 scripts/build_demos.py --check
